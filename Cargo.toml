[package]
name = "siro"
version = "0.1.0"
edition = "2021"
default-run = "siro"
authors = ["Siro Project Team"]
description = "Lightweight, offline STEM whiteboard and project planner for hardware builders"
license = "AGPL-3.0-only"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = { version = "0.31", features = ["default_fonts", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
rfd = "0.15"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.58", features = ["Data_Pdf", "Storage_Streams", "Storage"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
